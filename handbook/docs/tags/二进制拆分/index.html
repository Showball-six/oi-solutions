span>二进制拆分 · 相关章节</span></nav><article class="prose tag-content"><main class="col col--8 col--offset-2"><header class="margin-bottom--xl"><h1>二进制拆分 · 相关章节</h1><a href="../index.html">View all tags</a></header><section class="margin-vert--lg"><article class="margin-vert--lg"><a href="../../GESP%20C++8%E7%BA%A7/chapter3/index.html"><h2>第63章 倍增法</h2></a><p>倍增法(Binary Lifting)是一种基于"成倍增长"思想的高效算法，通过预处理将问题分解为多个$$2$$的幂次规模的子问题，从而在查询时实现快速合并求解。该算法在时间复杂度上通常能将线性查询优化为对数级，广泛应用于数论（快速幂）、图论（树上倍增求祖先/LCA）、RMQ（ST 表）等领域。</p></article></section></main><footer class="site-footer">© 2026 Showball OI · 学习与训练</footer><div class="toast" role="status" aria-live="polite"></div></body></html>
