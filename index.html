<script>
(() => {
 const $=id=>document.getElementById(id),input=$('global-search-input'),panel=$('search-panel'),results=$('search-results'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const index=[];let active=-1,loading=true;
 function add(type,title,meta,href,keywords=''){index.push({type,title,meta,href,text:`${title} ${meta} ${keywords}`.toLowerCase()});}
 function close(){panel.hidden=true;input.setAttribute('aria-expanded','false');}
 function search(){const q=input.value.trim().toLowerCase();active=-1;if(!q){close();return;}const matches=index.filter(x=>q.split(/\s+/).every(t=>x.text.includes(t))),counts={};let list=matches.filter(x=>{counts[x.type]=(counts[x.type]||0)+1;return counts[x.type]<=3}).slice(0,12);list=[...list,...matches.filter(x=>!list.includes(x))].slice(0,12);panel.hidden=false;input.setAttribute('aria-expanded','true');$('search-status').textContent=loading?'正在加载内容索引…':list.length?`显示 ${list.length} 条匹配结果`:'没有找到匹配内容';results.innerHTML=list.length?list.map(x=>`<a class="search-result" href="${esc(x.href)}"><span class="search-result-type">${esc(x.type)}</span><span class="search-result-main"><strong>${esc(x.title)}</strong><small>${esc(x.meta)}</small></span></a>`).join(''):'<div class="search-empty">试试题号、算法名称或比赛名称。</div>';}
 input.addEventListener('input',e=>{if(!e.isComposing)search()});input.addEventListener('compositionend',search);input.addEventListener('focus',()=>{if(input.value.trim())search()});
 input.addEventListener('keydown',e=>{const links=[...results.querySelectorAll('a')];if(e.key==='Escape'){close();return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!links.length)return;active=(active+(e.key==='ArrowDown'?1:-1)+links.length)%links.length;links.forEach((a,i)=>a.classList.toggle('active',i===active));links[active].scrollIntoView({block:'nearest'})}if(e.key==='Enter'&&links.length&&!e.isComposing){e.preventDefault();links[Math.max(0,active)].click()}});
 document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.activeElement.isContentEditable){e.preventDefault();input.focus()}});
 document.addEventListener('click',e=>{if(!e.target.closest('#global-search'))close();const b=e.target.closest('[data-search-suggestion]');if(b){input.value=b.dataset.searchSuggestion;input.focus();search()}});
 async function load(){
  const paths=['solutions/records.json','memos/courses.json','memos/lectures.json','exams/catalog.json'];
  const responses=await Promise.allSettled(paths.map(async p=>{const r=await fetch(p);if(!r.ok)throw Error(p);return r.json()}));
  const [records,courses,lectures,papers]=responses.map((r,i)=>r.status==='fulfilled'?r.value:i===1?{}:[]);
  records.forEach(r=>add('题解',`${r.pid} ${r.title}`,`${r.diff} · ${(r.tags||[]).join(' · ')}`,r.href));
  (courses.courses||[]).forEach(c=>{add('课程',c.title,'课程路径',`memos/detail.html?type=course&id=${encodeURIComponent(c.id)}`);(c.contents||[]).forEach(ct=>add('课程内容',ct.title,c.title,`memos/detail.html?type=${ct.type==='written'?'written':ct.type==='mock'?'mock':'content'}&course=${encodeURIComponent(c.id)}&id=${encodeURIComponent(ct.id)}`));});
  (courses.topics||[]).forEach(t=>add('知识点',t.title,'算法主题',`memos/detail.html?type=topic&id=${encodeURIComponent(t.id)}`));
  lectures.forEach(l=>add('讲义',l.title,(l.tags||[]).join(' · '),l.href));papers.forEach(p=>add('试卷',p.title,`${p.category} · ${p.level}级 · ${p.date}`,p.href));
  const recent=[...lectures.map(l=>({type:'讲义',title:l.title,date:l.created,href:l.href})),...papers.map(p=>({type:'试卷',title:p.title,date:p.date,href:p.href}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8);
  $('recent-list').innerHTML=recent.map(x=>`<a class="recent-row" href="${esc(x.href)}"><span>${x.type}</span><strong>${esc(x.title)}</strong><time>${esc(x.date||'')}</time></a>`).join('')||'<p class="small muted">暂时无法读取内容，可通过上方分类继续访问。</p>';
  loading=false;const failures=responses.filter(r=>r.status==='rejected').length;if(failures)$('index-status').textContent=`有 ${failures} 个内容索引暂时无法加载，当前搜索仅包含已加载的内容。刷新页面可重试。`;if(input.value)search();
 }
 load();
})();
</script></body></html>
