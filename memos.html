<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){
  try{
    const fetchJson=async(paths)=>{
      let lastError;
      for(const path of paths){
        try{const res=await fetch(path);if(res.ok)return await res.json();lastError=new Error(path+' '+res.status)}catch(err){lastError=err}
      }
      throw lastError||new Error('数据加载失败');
    };
    const[coursesData,lectures]=await Promise.all([
      fetchJson(['memos/courses.json']),
      fetchJson(['memos/lectures.json'])
    ]);
    const{courses=[],topics=[]}=coursesData;
    document.getElementById('course-meta').textContent=`${courses.length} 条学习路径`;
    document.getElementById('topic-meta').textContent=`${topics.length} 个算法主题`;
    document.getElementById('courses-grid').innerHTML=courses.map((c,i)=>{
      const lecCount=lectures.filter(l=>l.courses&&l.courses.includes(c.id)).length;
      const problemCount=(c.contents||[]).reduce((s,ct)=>s+(ct.problems||[]).filter(p=>p.type!=='divider').length,0);
      return `<a href="memos/detail.html?type=course&id=${encodeURIComponent(c.id)}" class="course-card"><div class="course-card-top"><span class="course-index">${String(i+1).padStart(2,'0')}</span><span class="course-arrow">↗</span></div><div class="course-card-title">${esc(c.title)}</div><div class="course-card-desc">${esc(c.description||c.desc||'系统课程与配套练习')}</div><div class="course-card-count">${lecCount} 篇讲义 · ${problemCount} 道练习</div></a>`;
    }).join('')||'<div class="empty-state">暂无课程</div>';
    document.getElementById('topics-grid').innerHTML=topics.map(t=>{
      const count=lectures.filter(l=>l.topics&&l.topics.includes(t.id)).length;
      return `<a href="memos/detail.html?type=topic&id=${encodeURIComponent(t.id)}" class="topic-card"><span class="topic-card-title">${esc(t.title)}</span><span class="topic-card-count">${count} 篇</span></a>`;
    }).join('')||'<div class="empty-state">暂无知识点</div>';
  }catch(e){console.error(e);document.getElementById('courses-grid').innerHTML='<div class="empty-state">暂时无法加载课程数据。</div>';document.getElementById('topics-grid').innerHTML='<div class="empty-state">暂时无法加载知识点数据。</div>';document.getElementById('course-meta').textContent='';}
}
init();
</script>
