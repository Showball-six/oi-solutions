async function fetchJson(paths){
  let lastError;
  for(const path of paths){
    try{
      const res = await fetch(path,{cache:'no-store'});
      if(res.ok) return await res.json();
      lastError = new Error(`${path} ${res.status}`);
    }catch(err){ lastError = err; }
  }
  throw lastError || new Error('数据加载失败');
}

async function loadCoreData(){
  if(location.protocol === 'file:'){
    return {coursesData:LOCAL_COURSES,allLectures:LOCAL_LECTURES,usingSnapshot:true};
  }
  try{
    const [coursesData,allLectures] = await Promise.all([
      fetchJson(['courses.json','../memos/courses.json','../momos/courses.json']),
      fetchJson(['lectures.json','../memos/lectures.json'])
    ]);
    return {coursesData,allLectures,usingSnapshot:false};
  }catch(err){
    console.warn('课程数据读取失败，使用内置快照。',err);
    return {coursesData:LOCAL_COURSES,allLectures:LOCAL_LECTURES,usingSnapshot:true};
  }
}

function escapeHtml(value=''){
  return String(value).replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}

function lectureHref(href){
  if(!href) return '#';
  if(/^(https?:)?\/\//i.test(href) || href.startsWith('/')) return href;
  if(href.startsWith('memos/')) return '../' + href;
  return href;
}

function setBreadcrumb(items=[]){
  const base=[
    '<a href="../index.html">首页</a>',
    '<span class="breadcrumb-sep">›</span>',
    '<a href="../memos.html">课程</a>'
  ];
  items.forEach(item=>{
    base.push('<span class="breadcrumb-sep">›</span>');
    base.push(item.href
      ? `<a href="${escapeHtml(item.href)}">${escapeHtml(item.label)}</a>`
      : `<span>${escapeHtml(item.label)}</span>`);
  });
  document.getElementById('breadcrumb').innerHTML=base.join('');
}

function uniqueLectures(ids,lectureMap){
  const seen=new Set();
  return (ids||[]).map(id=>lectureMap.get(id)).filter(l=>l && !seen.has(l.id) && seen.add(l.id));
}

function renderLectureCards(lectures){
  if(!lectures.length) return '<div class="empty-state">暂无讲义</div>';
  return `<div class="lecture-list">${lectures.map(l=>`
    <a class="lecture-card" href="${escapeHtml(lectureHref(l.href))}">
      <div class="lecture-card-main">
        <span class="lecture-card-title">${escapeHtml(l.title)}</span>
        <div class="lecture-card-meta">
          ${l.created ? `<span>${escapeHtml(l.created)}</span>` : ''}
          ${(l.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
      <span class="lecture-arrow">→</span>
    </a>`).join('')}</div>`;
}

function renderGroupedCourse(course,lectureMap){
  const groups=(course.contents||[]).map(content=>({
    content,
    lectures:uniqueLectures(content.lectures,lectureMap)
  })).filter(group=>group.lectures.length);

  if(!groups.length) return '<div class="empty-state">该课程暂时还没有讲义</div>';

  return groups.map(({content,lectures})=>`
    <section class="lecture-group">
      <div class="lecture-group-head">
        <h2 class="lecture-group-title">${escapeHtml(content.title)}</h2>
        <span class="lecture-group-count">${lectures.length} 篇讲义</span>
      </div>
      ${renderLectureCards(lectures)}
    </section>`).join('');
}

function courseLectureCount(course){
  return new Set((course.contents||[]).flatMap(c=>c.lectures||[])).size;
}

function setHero(badge,title,desc,count){
  document.getElementById('hero-badge').textContent=badge;
  document.getElementById('hero-title').textContent=title;
  document.getElementById('hero-desc').textContent=desc;
  document.getElementById('course-summary').innerHTML = count == null ? '' : `<span class="summary-chip">${count} 篇讲义</span>`;
}

async function init(){
  const {coursesData,allLectures,usingSnapshot}=await loadCoreData();
  const lectureMap=new Map(allLectures.map(l=>[l.id,l]));
  const courses=coursesData.courses||[];
  const topics=coursesData.topics||[];

  document.getElementById('load-note').textContent = usingSnapshot
    ? '当前为本地预览数据；通过 HTTP/HTTPS 部署时会实时读取 courses.json 与 lectures.json。'
    : '';

  if(!TYPE){
    setBreadcrumb([]);
    setHero('课程','缺少详情参数','请从课程页面进入对应课程或知识点。',null);
    document.getElementById('main-content').innerHTML='<div class="empty-state">没有可显示的内容</div>';
    return;
  }

  if(TYPE==='course'){
    const course=courses.find(c=>c.id===ID);
    if(!course) throw new Error('未找到课程');
    document.title=`${course.title} · Showball OI`;
    setBreadcrumb([{label:course.title}]);
    const count=courseLectureCount(course);
    setHero('课程',course.title,'按课程章节整理的讲义，点击即可进入阅读。',count);
    document.getElementById('main-content').innerHTML=renderGroupedCourse(course,lectureMap);
    return;
  }

  if(TYPE==='topic'){
    const topic=topics.find(t=>t.id===ID);
    if(!topic) throw new Error('未找到知识点');
    const lectures=allLectures.filter(l=>(l.topics||[]).includes(ID));
    document.title=`${topic.title} · Showball OI`;
    setBreadcrumb([{label:topic.title}]);
    setHero('知识点',topic.title,'该知识点下整理的全部讲义。',lectures.length);
    document.getElementById('main-content').innerHTML=renderLectureCards(lectures);
    return;
  }

  if(TYPE==='content'){
    const course=courses.find(c=>c.id===COURSE);
    const content=(course?.contents||[]).find(c=>c.id===ID);
    if(!course || !content) throw new Error('未找到课程章节');
    const lectures=uniqueLectures(content.lectures,lectureMap);
    document.title=`${content.title} · Showball OI`;
    setBreadcrumb([
      {label:course.title,href:`detail.html?type=course&id=${encodeURIComponent(course.id)}`},
      {label:content.title}
    ]);
    setHero(course.title,content.title,'本章节讲义，点击即可进入阅读。',lectures.length);
    document.getElementById('main-content').innerHTML=renderLectureCards(lectures);
    return;
  }

  // 兼容旧的竞赛详情链接：只提取其中关联的讲义，不再展示题目、排名或学生数据。
  if(TYPE==='contest-section'){
    const course=courses.find(c=>c.id==='contest-prep');
    const contents=(course?.contents||[]).filter(c=>c.type===SECTION);
    const groups=contents.map(content=>({content,lectures:uniqueLectures(content.lectures,lectureMap)})).filter(g=>g.lectures.length);
    const label=SECTION==='written'?'笔试讲义':'上机讲义';
    setBreadcrumb([{label:course?.title||'竞赛备赛',href:'detail.html?type=course&id=contest-prep'},{label}]);
    setHero('竞赛备赛',label,'这里只保留与课程关联的讲义。',groups.reduce((s,g)=>s+g.lectures.length,0));
    document.getElementById('main-content').innerHTML=groups.length
      ? groups.map(g=>`<section class="lecture-group"><div class="lecture-group-head"><h2 class="lecture-group-title">${escapeHtml(g.content.title)}</h2><span class="lecture-group-count">${g.lectures.length} 篇讲义</span></div>${renderLectureCards(g.lectures)}</section>`).join('')
      : '<div class="empty-state">暂无关联讲义</div>';
    return;
  }

  if(TYPE==='written' || TYPE==='mock'){
    const course=courses.find(c=>c.id===COURSE);
    const content=(course?.contents||[]).find(c=>c.id===ID);
    if(!course || !content) throw new Error('未找到课程内容');
    const lectures=uniqueLectures(content.lectures,lectureMap);
    setBreadcrumb([{label:course.title,href:`detail.html?type=course&id=${encodeURIComponent(course.id)}`},{label:content.title}]);
    setHero(course.title,content.title,'这里只保留与该内容关联的讲义。',lectures.length);
    document.getElementById('main-content').innerHTML=renderLectureCards(lectures);
    return;
  }

  throw new Error('未知详情类型');
}

init().catch(err=>{
  console.error(err);
  setBreadcrumb([]);
  setHero('课程','课程详情加载失败',err.message || '请检查课程数据或页面参数。',null);
  document.getElementById('main-content').innerHTML='<div class="empty-state">无法显示当前内容，请从课程页面重新进入。</div>';
});
</script>
