  <text x="462" y="48" font-size="20" fill="#25394c" text-anchor="start" font-weight="700">计算第 3 行第 2 列</text>
  <text x="462" y="87" font-size="17" fill="#285d92" text-anchor="start" font-weight="400">左上格累计和为 7，加 3 得到 10。</text>
  <text x="462" y="120" font-size="17" fill="#276647" text-anchor="start" font-weight="400">正上格累计和为 13，加 3 得到 16。</text>
  <rect x="462" y="148" width="386" height="56" rx="9" fill="#e8f2fc" stroke="#bac8d4"/>
  <text x="478" y="176" font-size="17" fill="#285d92" text-anchor="start" font-weight="700">f[3][2] = max(7 + 3, 13 + 3) = 16</text>
