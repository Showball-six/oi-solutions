<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img">
<title>队列分层与入队时标记</title>
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="30" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#34495e" text-anchor="start" dominant-baseline="central">同一个状态可能被多条路线找到</text>
<line x1="100" y1="160" x2="300" y2="95" stroke="#8098aa" stroke-width="3"/>
<line x1="100" y1="160" x2="300" y2="235" stroke="#8098aa" stroke-width="3"/>
<line x1="300" y1="95" x2="510" y2="160" stroke="#8098aa" stroke-width="3"/>
<line x1="300" y1="235" x2="510" y2="160" stroke="#8098aa" stroke-width="3"/>
<rect x="75" y="135" width="50" height="50" fill="#c7e8cc" stroke="#b3c2ce"/>
<text x="100" y="160" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#34495e" text-anchor="middle" dominant-baseline="central">A</text>
<rect x="275" y="70" width="50" height="50" fill="#dae9ff" stroke="#b3c2ce"/>
<text x="300" y="95" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#34495e" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="275" y="210" width="50" height="50" fill="#dae9ff" stroke="#b3c2ce"/>
<text x="300" y="235" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#34495e" text-anchor="middle" dominant-baseline="central">C</text>
<rect x="485" y="135" width="50" height="50" fill="#ffe1a6" stroke="#b3c2ce"/>
<text x="510" y="160" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#34495e" text-anchor="middle" dominant-baseline="central">D</text>
<text x="70" y="290" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#34495e" text-anchor="start" dominant-baseline="central">第 0 层</text>
<text x="270" y="290" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#34495e" text-anchor="start" dominant-baseline="central">第 1 层</text>
<text x="480" y="290" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#34495e" text-anchor="start" dominant-baseline="central">第 2 层</text>
<text x="595" y="90" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#34495e" text-anchor="start" dominant-baseline="central">B 找到 D：立即标记、入队</text>
<text x="595" y="140" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#34495e" text-anchor="start" dominant-baseline="central">队列：C → D</text>
<text x="595" y="195" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#34495e" text-anchor="start" dominant-baseline="central">C 再遇到 D：已经标记</text>
<text x="595" y="230" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#34495e" text-anchor="start" dominant-baseline="central">跳过，不重复入队。</text>
</svg>