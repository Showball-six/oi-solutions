<svg xmlns="http://www.w3.org/2000/svg" width="864" height="337" viewBox="0 0 864 337" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, PingFang SC, sans-serif" dominant-baseline="central">
  <title id="title">青蛙跳的两条入边</title>
  <desc id="desc">从第 2 块石头跳到第 4 块需要 10，总代价 30。从第 3 块跳到第 4 块需要 20，总代价 50。取较小的 30。</desc>
  <rect x="0" y="0" width="864" height="337" rx="0" fill="#fff" stroke="none"/>
  <text x="25" y="29" font-size="20" fill="#25394c" text-anchor="start" font-weight="700">跳到第 4 块石头时，比较两个前驱</text>
  <path d="M 330 211 Q 531 25 728 211" fill="none" stroke="#276647" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="728" y1="211" x2="718.7098998883508" y2="207.72982570563326" stroke="#276647" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="728" y1="211" x2="724.2020210508991" y2="201.91290167863323" stroke="#276647" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 532 211 Q 636 102 740 211" fill="none" stroke="#945418" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="740" y1="211" x2="730.893114368381" y2="207.24971546511316" stroke="#945418" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="740" y1="211" x2="736.6811641284187" y2="201.72717257480193" stroke="#945418" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="355" y="88" width="315" height="28" rx="4" fill="#fff" stroke="none"/>
  <text x="512.5" y="102" font-size="16" fill="#276647" text-anchor="middle" font-weight="700">2 → 4，跳跃代价 10，累计 20 + 10 = 30</text>
  <rect x="518" y="143" width="320" height="28" rx="4" fill="#fff" stroke="none"/>
  <text x="678" y="157" font-size="16" fill="#945418" text-anchor="middle" font-weight="700">3 → 4，跳跃代价 20，累计 30 + 20 = 50</text>
  <rect x="27" y="220" width="185" height="64" rx="9" fill="#f3f6f9" stroke="#bac8d4"/>
  <text x="119.5" y="241.12" font-size="17" fill="#25394c" text-anchor="middle" font-weight="700">第 1 块，高度 10</text>
  <text x="119.5" y="266.72" font-size="16" fill="#25394c" text-anchor="middle" font-weight="400">f[1] = 0</text>
  <rect x="228" y="220" width="185" height="64" rx="9" fill="#e5f4eb" stroke="#bac8d4"/>
  <text x="320.5" y="241.12" font-size="17" fill="#276647" text-anchor="middle" font-weight="700">第 2 块，高度 30</text>
  <text x="320.5" y="266.72" font-size="16" fill="#276647" text-anchor="middle" font-weight="400">f[2] = 20</text>
  <rect x="429" y="220" width="185" height="64" rx="9" fill="#fff1dc" stroke="#bac8d4"/>
  <text x="521.5" y="241.12" font-size="17" fill="#945418" text-anchor="middle" font-weight="700">第 3 块，高度 40</text>
  <text x="521.5" y="266.72" font-size="16" fill="#945418" text-anchor="middle" font-weight="400">f[3] = 30</text>
  <rect x="630" y="220" width="185" height="64" rx="9" fill="#e8f2fc" stroke="#bac8d4"/>
  <text x="722.5" y="241.12" font-size="17" fill="#285d92" text-anchor="middle" font-weight="700">第 4 块，高度 20</text>
  <text x="722.5" y="266.72" font-size="16" fill="#285d92" text-anchor="middle" font-weight="400">f[4] = 30</text>
  <text x="26" y="314" font-size="16" fill="#50667a" text-anchor="start" font-weight="400">每条箭头把前驱的最小代价与本次跳跃代价相加，最后取较小值。</text>
</svg>
