<svg xmlns="http://www.w3.org/2000/svg" width="920" height="526" viewBox="0 0 920 526" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <title id="title">LCIS 一维原地更新：为什么 mx 不会读到本轮的新值？</title>
  <desc id="desc">a 为 (1,2,5,4,5)，处理 a[4]=4 时，一维数组 f 初始为 [1,2,0,0,3]。从左向右扫描 b=(1,2,4,4,5)。前两列的 b[j] 小于 4，读取上一轮 f，把 mx 先变为 1，再变为 2。第三和第四列的 b[j] 等于 4，两处都用 mx+1=3 更新 f[j]，都不把新值存进 mx，因此相同的值不会相接。最后一列大于 4，不变。轮末 f 为 [1,2,3,3,3]。</desc>
  <defs>
    <marker id="scan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#50667a"/>
    </marker>
  </defs>
  <rect width="920" height="526" fill="#fff"/>
  <g fill="#25394c">
    <text x="32" y="40" font-size="26" font-weight="700">LCIS 一维原地更新：mx 为什么不会读到新值？</text>
    <text x="32" y="74" font-size="17">a = (1, 2, 5, 4, 5)　 这一轮处理 a[4] = 4</text>
    <text x="32" y="102" font-size="17" fill="#50667a">轮初 f = [1, 2, 0, 0, 3]，mx = 0</text>
  </g>
  <path d="M32 122 H888" stroke="#d0dae4"/>

  <text x="42" y="177" fill="#50667a" font-size="16" font-weight="700">沿 b 从左到右扫</text>
  <path d="M42 217 H878" fill="none" stroke="#8ea1b2" stroke-width="2" marker-end="url(#scan)"/>
  <path d="M473 196 Q546 145 619 196" fill="none" stroke="#ae5035" stroke-width="1.8" stroke-dasharray="5 4"/>
  <rect x="534" y="159" width="24" height="22" rx="9" fill="#fff"/>
  <path d="M541 166 L551 176 M551 166 L541 176" stroke="#ae5035" stroke-width="2.4" stroke-linecap="round"/>
  <text x="546" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#914329">前一个 4 不能接到后一个 4 前面</text>

  <g stroke-width="1.7">
    <circle cx="112" cy="217" r="24" fill="#e5f4eb" stroke="#86af99"/>
    <circle cx="286" cy="217" r="24" fill="#e5f4eb" stroke="#86af99"/>
    <circle cx="460" cy="217" r="24" fill="#e8f2fc" stroke="#83a8ca"/>
    <circle cx="634" cy="217" r="24" fill="#e8f2fc" stroke="#83a8ca"/>
    <circle cx="808" cy="217" r="24" fill="#f4f7fa" stroke="#bac8d4"/>
  </g>
  <g fill="#25394c" text-anchor="middle" font-size="22" font-weight="700">
    <text x="112" y="225">1</text><text x="286" y="225">2</text><text x="460" y="225">4</text><text x="634" y="225">4</text><text x="808" y="225">5</text>
  </g>
  <g fill="#50667a" text-anchor="middle" font-size="15">
    <text x="112" y="265">b[1]</text><text x="286" y="265">b[2]</text><text x="460" y="265">b[3]</text><text x="634" y="265">b[4]</text><text x="808" y="265">b[5]</text>
  </g>

  <g text-anchor="middle" font-size="16" font-weight="700">
    <rect x="51" y="279" width="122" height="30" rx="15" fill="#e5f4eb"/>
    <text x="112" y="300" fill="#276647">更小 · 读 f[1]</text>
    <rect x="225" y="279" width="122" height="30" rx="15" fill="#e5f4eb"/>
    <text x="286" y="300" fill="#276647">更小 · 读 f[2]</text>
    <rect x="399" y="279" width="122" height="30" rx="15" fill="#e8f2fc"/>
    <text x="460" y="300" fill="#285d92">相等 · 写 f[3]</text>
    <rect x="573" y="279" width="122" height="30" rx="15" fill="#e8f2fc"/>
    <text x="634" y="300" fill="#285d92">相等 · 写 f[4]</text>
    <rect x="747" y="279" width="122" height="30" rx="15" fill="#f4f7fa"/>
    <text x="808" y="300" fill="#50667a">更大 · 跳过</text>
  </g>
  <g text-anchor="middle" fill="#25394c" font-size="17">
    <text x="112" y="336">f[1] = 1</text><text x="286" y="336">f[2] = 2</text>
    <text x="460" y="336">f[3]：0 → 3</text><text x="634" y="336">f[4]：0 → 3</text><text x="808" y="336">f[5] 仍为 3</text>
    <text x="112" y="363" fill="#276647" font-weight="700">mx：0 → 1</text><text x="286" y="363" fill="#276647" font-weight="700">mx：1 → 2</text>
    <text x="460" y="363" fill="#50667a">mx 仍为 2</text><text x="634" y="363" fill="#50667a">mx 仍为 2</text><text x="808" y="363" fill="#50667a">mx 仍为 2</text>
  </g>

  <rect x="32" y="389" width="856" height="82" rx="12" fill="#f4f7fa"/>
  <text x="51" y="421" fill="#25394c" font-size="18" font-weight="700">只有 b[j] &lt; a[i] 才能用 f[j] 更新 mx，而本轮只改 b[j] = a[i] 的格子。</text>
  <text x="51" y="450" fill="#50667a" font-size="16">因此 mx 只读上一轮的值。两次遇到 4，都用 mx + 1 = 3 更新对应的 f[j]。</text>
  <text x="32" y="505" fill="#25394c" font-size="17" font-weight="700">轮末 f = [1, 2, 3, 3, 3]</text>
  <text x="888" y="505" text-anchor="end" fill="#50667a" font-size="16">DP 只存 m 个状态：O(m)</text>
</svg>
