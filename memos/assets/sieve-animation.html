<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>筛法可视化：埃氏筛与欧拉筛</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: rgba(255, 255, 255, 0.94);
      --text: #18212f;
      --muted: #6b7280;
      --border: #e4eaf2;

      --normal-bg: #ffffff;
      --normal-border: #d9e2ef;

      --prime-bg: #dff7e7;
      --prime-border: #72c58c;
      --prime-text: #24633a;

      --composite-bg: #fde7e7;
      --composite-border: #e58d8d;
      --composite-text: #8f2f2f;

      --current-bg: #fff0bf;
      --current-border: #dda83d;

      --active-bg: #e8f0ff;
      --active-border: #6f98ef;

      --repeat-bg: #f1e8ff;
      --repeat-border: #9a6be4;

      --success: #2f8f57;
      --danger: #c44747;
      --shadow: 0 18px 48px rgba(31, 41, 55, 0.08);

      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 0%, rgba(111, 152, 239, 0.10), transparent 32rem),
        radial-gradient(circle at 100% 18%, rgba(114, 197, 140, 0.10), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        Arial, sans-serif;
    }

    body {
      padding: 24px;
    }

    button,
    select,
    input {
      font: inherit;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 38px);
      letter-spacing: -0.03em;
    }

    .title-block p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .algorithm-tabs {
      display: inline-flex;
      padding: 5px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(31, 41, 55, 0.05);
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 18px;
      border-radius: 11px;
      cursor: pointer;
      transition: 160ms ease;
      white-space: nowrap;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 5px 16px rgba(31, 41, 55, 0.10);
    }

    .main-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(48px, 1fr));
      gap: 12px;
    }

    .cell {
      position: relative;
      min-width: 0;
      aspect-ratio: 1.08 / 1;
      border-radius: var(--radius-md);
      border: 2px solid var(--normal-border);
      background: var(--normal-bg);
      display: grid;
      place-items: center;
      font-size: clamp(18px, 2.4vw, 30px);
      font-weight: 680;
      color: var(--text);
      transition:
        transform 180ms ease,
        background-color 220ms ease,
        border-color 220ms ease,
        box-shadow 220ms ease,
        color 220ms ease;
      user-select: none;
    }

    .cell.one {
      color: #9aa2af;
      background: #f3f4f6;
      border-color: #d9dde4;
    }

    .cell.prime {
      background: var(--prime-bg);
      border-color: var(--prime-border);
      color: var(--prime-text);
    }

    .cell.composite {
      background: var(--composite-bg);
      border-color: var(--composite-border);
      color: var(--composite-text);
    }

    .cell.current-i {
      background: var(--current-bg);
      border-color: var(--current-border);
      color: #6f4d00;
      box-shadow: 0 0 0 5px rgba(221, 168, 61, 0.14);
    }

    .cell.active-product {
      background: var(--active-bg);
      border-color: var(--active-border);
      color: #2a4d97;
      transform: scale(1.09);
      box-shadow: 0 11px 24px rgba(111, 152, 239, 0.22);
      z-index: 2;
    }

    .cell.repeat-hit {
      background: var(--repeat-bg);
      border-color: var(--repeat-border);
      color: #5f2ba8;
      transform: scale(1.09);
      box-shadow: 0 11px 24px rgba(154, 107, 228, 0.20);
      z-index: 2;
    }

    .hit-badge {
      position: absolute;
      top: -9px;
      right: -8px;
      min-width: 30px;
      height: 25px;
      padding: 0 7px;
      border-radius: 999px;
      background: #8756d7;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 750;
      box-shadow: 0 5px 12px rgba(97, 51, 170, 0.25);
    }

    .dashboard {
      margin-top: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(250px, 1fr);
      gap: 16px;
    }

    .info-panel,
    .prime-panel {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.82);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    .info-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      min-height: 92px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fbfcfe;
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 9px;
    }

    .metric-value {
      font-size: clamp(20px, 2.7vw, 32px);
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .status-line {
      margin-top: 13px;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 14px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #a9b1bd;
      flex: 0 0 auto;
    }

    .status-dot.running {
      background: #5b8def;
      box-shadow: 0 0 0 6px rgba(91, 141, 239, 0.12);
    }

    .status-dot.break {
      background: #e29a2f;
      box-shadow: 0 0 0 6px rgba(226, 154, 47, 0.12);
    }

    .status-dot.done {
      background: var(--success);
      box-shadow: 0 0 0 6px rgba(47, 143, 87, 0.12);
    }

    .prime-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 14px;
    }

    .prime-count {
      font-variant-numeric: tabular-nums;
    }

    .prime-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      min-height: 68px;
      align-content: flex-start;
    }

    .prime-chip {
      min-width: 43px;
      height: 38px;
      padding: 0 12px;
      border-radius: 13px;
      border: 1.5px solid var(--prime-border);
      background: var(--prime-bg);
      color: var(--prime-text);
      display: grid;
      place-items: center;
      font-weight: 720;
      animation: chip-in 220ms ease both;
    }

    @keyframes chip-in {
      from {
        opacity: 0;
        transform: translateY(5px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .controls {
      margin-top: 16px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.86);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .btn {
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      padding: 0 15px;
      cursor: pointer;
      transition: 150ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #cbd5e3;
      box-shadow: 0 7px 15px rgba(31, 41, 55, 0.07);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn.primary {
      border-color: #557ed2;
      background: #5d88df;
      color: #fff;
      min-width: 104px;
    }

    .btn.danger {
      color: #a23838;
    }

    .speed-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .speed-select {
      height: 42px;
      min-width: 94px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .progress-wrap {
      flex: 1 1 240px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 210px;
    }

    .progress {
      position: relative;
      height: 8px;
      flex: 1;
      border-radius: 999px;
      background: #e9edf3;
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #6f98ef, #72c58c);
      border-radius: inherit;
      transition: width 160ms ease;
    }

    .progress-text {
      color: var(--muted);
      font-size: 13px;
      min-width: 82px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .hint {
      margin: 14px 4px 0;
      color: #7a8492;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 840px) {
      body {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .main-card {
        padding: 14px;
      }

      .number-grid {
        gap: 7px;
      }

      .cell {
        border-radius: 10px;
      }

      .dashboard {
        grid-template-columns: 1fr;
      }

      .info-row {
        gap: 8px;
      }

      .metric {
        min-height: 80px;
        padding: 11px;
      }
    }

    @media (max-width: 560px) {
      .number-grid {
        grid-template-columns: repeat(5, minmax(46px, 1fr));
      }

      .info-row {
        grid-template-columns: 1fr;
      }

      .algorithm-tabs,
      .tab {
        width: 100%;
      }

      .algorithm-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .controls {
        align-items: stretch;
      }

      .control-group,
      .progress-wrap {
        width: 100%;
      }

      .btn {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <h1>筛法可视化</h1>
        <p>埃氏筛与欧拉筛 · 支持播放、暂停、单步与调速</p>
      </div>

      <div class="algorithm-tabs" role="tablist" aria-label="算法选择">
        <button class="tab active" data-algorithm="eratosthenes" role="tab">
          埃氏筛
        </button>
        <button class="tab" data-algorithm="euler" role="tab">
          欧拉筛
        </button>
      </div>
    </header>

    <section class="main-card">
      <div id="numberGrid" class="number-grid" aria-label="数字状态网格"></div>

      <div class="dashboard">
        <section class="info-panel">
          <div class="info-row">
            <article class="metric">
              <div class="metric-label">当前 i</div>
              <div id="currentI" class="metric-value">—</div>
            </article>

            <article class="metric">
              <div id="secondLabel" class="metric-label">当前倍数</div>
              <div id="currentP" class="metric-value">—</div>
            </article>

            <article class="metric">
              <div class="metric-label">当前操作</div>
              <div id="expression" class="metric-value">—</div>
            </article>
          </div>

          <div class="status-line">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">准备开始</span>
          </div>
        </section>

        <aside class="prime-panel">
          <div class="prime-title">
            <span>Prime</span>
            <span id="primeCount" class="prime-count">0 个</span>
          </div>
          <div id="primeList" class="prime-list"></div>
        </aside>
      </div>

      <div class="controls">
        <div class="control-group">
          <button id="resetBtn" class="btn danger" type="button">↺ 重置</button>
          <button id="prevBtn" class="btn" type="button">← 上一步</button>
          <button id="playBtn" class="btn primary" type="button">▶ 播放</button>
          <button id="nextBtn" class="btn" type="button">下一步 →</button>
        </div>

        <div class="speed-wrap">
          <label for="speedSelect">速度</label>
          <select id="speedSelect" class="speed-select">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </div>

        <div class="progress-wrap">
          <div class="progress" aria-hidden="true">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <div id="progressText" class="progress-text">0 / 0</div>
        </div>
      </div>

      <p class="hint">
        埃氏筛中，紫色闪烁表示该合数被重复筛除；欧拉筛中，每个合数只由其最小质因子筛除一次。
      </p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const LIMIT = 40;

      const grid = document.getElementById("numberGrid");
      const currentIEl = document.getElementById("currentI");
      const currentPEl = document.getElementById("currentP");
      const secondLabelEl = document.getElementById("secondLabel");
      const expressionEl = document.getElementById("expression");
      const statusTextEl = document.getElementById("statusText");
      const statusDotEl = document.getElementById("statusDot");
      const primeListEl = document.getElementById("primeList");
      const primeCountEl = document.getElementById("primeCount");
      const playBtn = document.getElementById("playBtn");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const resetBtn = document.getElementById("resetBtn");
      const speedSelect = document.getElementById("speedSelect");
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      const tabs = [...document.querySelectorAll(".tab")];

      const cells = new Map();

      let algorithm = "eratosthenes";
      let steps = [];
      let stepIndex = 0;
      let isPlaying = false;
      let timerId = null;
      let speed = 1;

      function createGrid() {
        const fragment = document.createDocumentFragment();

        for (let n = 1; n <= LIMIT; n += 1) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.number = String(n);
          cell.textContent = String(n);

          if (n === 1) {
            cell.classList.add("one");
          }

          cells.set(n, cell);
          fragment.appendChild(cell);
        }

        grid.replaceChildren(fragment);
      }

      function blankState() {
        return {
          primes: [],
          composite: Array(LIMIT + 1).fill(false),
          hitCount: Array(LIMIT + 1).fill(0),
          currentI: null,
          currentP: null,
          currentProduct: null,
          expression: "—",
          status: "准备开始",
          statusKind: "idle",
          repeated: false,
          duration: 700
        };
      }

      function cloneState(state, patch = {}) {
        return {
          ...state,
          primes: [...state.primes],
          composite: [...state.composite],
          hitCount: [...state.hitCount],
          ...patch
        };
      }

      function pushStep(list, state, patch = {}) {
        const next = cloneState(state, patch);
        list.push(next);
        return next;
      }

      function buildEratosthenesSteps() {
        const list = [];
        let state = blankState();

        state = pushStep(list, state, {
          status: "从 2 开始寻找质数",
          duration: 900
        });

        for (let i = 2; i <= LIMIT; i += 1) {
          if (state.composite[i]) continue;

          state.primes.push(i);
          state = pushStep(list, state, {
            currentI: i,
            currentP: i,
            currentProduct: null,
            expression: `${i} 是质数`,
            status: `将 ${i} 加入质数表`,
            statusKind: "running",
            repeated: false,
            duration: 800
          });

          for (let multiple = i * i; multiple <= LIMIT; multiple += i) {
            const alreadyMarked = state.composite[multiple];
            state.hitCount[multiple] += 1;

            state = pushStep(list, state, {
              currentI: i,
              currentP: multiple / i,
              currentProduct: multiple,
              expression: `${i} × ${multiple / i} = ${multiple}`,
              status: alreadyMarked
                ? `${multiple} 已经被筛除，再次命中`
                : `筛除 ${multiple}`,
              statusKind: alreadyMarked ? "repeat" : "running",
              repeated: alreadyMarked,
              duration: alreadyMarked ? 900 : 650
            });

            state.composite[multiple] = true;

            state = pushStep(list, state, {
              currentI: i,
              currentP: multiple / i,
              currentProduct: null,
              expression: `${i} × ${multiple / i} = ${multiple}`,
              status: alreadyMarked
                ? `${multiple} 的重复筛除次数为 ${state.hitCount[multiple]}`
                : `${multiple} 已标记为合数`,
              statusKind: alreadyMarked ? "repeat" : "running",
              repeated: false,
              duration: 420
            });
          }

          state = pushStep(list, state, {
            currentI: i,
            currentP: null,
            currentProduct: null,
            expression: "—",
            status: `完成质数 ${i} 的倍数筛除`,
            statusKind: "idle",
            repeated: false,
            duration: 420
          });
        }

        state = pushStep(list, state, {
          currentI: null,
          currentP: null,
          currentProduct: null,
          expression: "完成",
          status: "筛选完成 · 时间复杂度 O(n log log n)",
          statusKind: "done",
          repeated: false,
          duration: 2200
        });

        return list;
      }

      function buildEulerSteps() {
        const list = [];
        let state = blankState();

        state = pushStep(list, state, {
          status: "从 2 开始线性扫描",
          duration: 900
        });

        for (let i = 2; i <= LIMIT; i += 1) {
          if (!state.composite[i]) {
            state.primes.push(i);

            state = pushStep(list, state, {
              currentI: i,
              currentP: null,
              currentProduct: null,
              expression: `${i} 是质数`,
              status: `将 ${i} 加入质数表`,
              statusKind: "running",
              repeated: false,
              duration: 760
            });
          } else {
            state = pushStep(list, state, {
              currentI: i,
              currentP: null,
              currentProduct: null,
              expression: `${i} 是合数`,
              status: `继续枚举质数 p`,
              statusKind: "idle",
              repeated: false,
              duration: 420
            });
          }

          for (const p of state.primes) {
            const product = i * p;
            if (product > LIMIT) {
              state = pushStep(list, state, {
                currentI: i,
                currentP: p,
                currentProduct: null,
                expression: `${i} × ${p} > ${LIMIT}`,
                status: "乘积超出范围，结束当前轮",
                statusKind: "idle",
                repeated: false,
                duration: 550
              });
              break;
            }

            state.hitCount[product] += 1;

            state = pushStep(list, state, {
              currentI: i,
              currentP: p,
              currentProduct: product,
              expression: `${i} × ${p} = ${product}`,
              status: `用质数 ${p} 标记 ${product}`,
              statusKind: "running",
              repeated: false,
              duration: 680
            });

            state.composite[product] = true;

            state = pushStep(list, state, {
              currentI: i,
              currentP: p,
              currentProduct: null,
              expression: `${i} × ${p} = ${product}`,
              status: `${product} 已标记为合数`,
              statusKind: "running",
              repeated: false,
              duration: 430
            });

            if (i % p === 0) {
              state = pushStep(list, state, {
                currentI: i,
                currentP: p,
                currentProduct: null,
                expression: `${i} mod ${p} = 0`,
                status: `✓ break：${p} 是 ${i} 的最小质因子`,
                statusKind: "break",
                repeated: false,
                duration: 1050
              });
              break;
            }
          }
        }

        state = pushStep(list, state, {
          currentI: null,
          currentP: null,
          currentProduct: null,
          expression: "完成",
          status: "筛选完成 · 时间复杂度 O(n)",
          statusKind: "done",
          repeated: false,
          duration: 2200
        });

        return list;
      }

      function buildSteps() {
        steps = algorithm === "eratosthenes"
          ? buildEratosthenesSteps()
          : buildEulerSteps();

        stepIndex = 0;
        updateSecondLabel();
        render();
      }

      function updateSecondLabel() {
        secondLabelEl.textContent =
          algorithm === "eratosthenes" ? "当前倍数" : "当前质数 p";
      }

      function clearCellVisuals(cell) {
        cell.classList.remove(
          "prime",
          "composite",
          "current-i",
          "active-product",
          "repeat-hit"
        );

        const badge = cell.querySelector(".hit-badge");
        if (badge) badge.remove();
      }

      function render() {
        const state = steps[stepIndex] ?? blankState();

        for (let n = 1; n <= LIMIT; n += 1) {
          const cell = cells.get(n);
          clearCellVisuals(cell);

          if (n === 1) {
            cell.classList.add("one");
            continue;
          }

          if (state.composite[n]) {
            cell.classList.add("composite");
          } else if (state.primes.includes(n)) {
            cell.classList.add("prime");
          }

          if (n === state.currentI) {
            cell.classList.add("current-i");
          }

          if (n === state.currentProduct) {
            cell.classList.add(
              state.repeated ? "repeat-hit" : "active-product"
            );
          }

          if (
            algorithm === "eratosthenes" &&
            state.hitCount[n] >= 2
          ) {
            const badge = document.createElement("span");
            badge.className = "hit-badge";
            badge.textContent = `×${state.hitCount[n]}`;
            cell.appendChild(badge);
          }
        }

        currentIEl.textContent =
          state.currentI == null ? "—" : String(state.currentI);

        currentPEl.textContent =
          state.currentP == null ? "—" : String(state.currentP);

        expressionEl.textContent = state.expression ?? "—";
        statusTextEl.textContent = state.status ?? "";

        statusDotEl.className = "status-dot";
        if (state.statusKind === "running" || state.statusKind === "repeat") {
          statusDotEl.classList.add("running");
        } else if (state.statusKind === "break") {
          statusDotEl.classList.add("break");
        } else if (state.statusKind === "done") {
          statusDotEl.classList.add("done");
        }

        primeListEl.replaceChildren(
          ...state.primes.map((prime) => {
            const chip = document.createElement("span");
            chip.className = "prime-chip";
            chip.textContent = String(prime);
            return chip;
          })
        );

        primeCountEl.textContent = `${state.primes.length} 个`;

        const denominator = Math.max(steps.length - 1, 1);
        const progress = (stepIndex / denominator) * 100;
        progressBar.style.width = `${progress}%`;
        progressText.textContent = `${stepIndex + 1} / ${steps.length}`;

        prevBtn.disabled = stepIndex <= 0;
        nextBtn.disabled = stepIndex >= steps.length - 1;

        playBtn.textContent = isPlaying ? "❚❚ 暂停" : "▶ 播放";
      }

      function stopPlayback() {
        isPlaying = false;
        if (timerId !== null) {
          window.clearTimeout(timerId);
          timerId = null;
        }
        render();
      }

      function scheduleNext() {
        if (!isPlaying) return;

        if (stepIndex >= steps.length - 1) {
          stopPlayback();
          return;
        }

        const state = steps[stepIndex];
        const delay = Math.max(80, state.duration / speed);

        timerId = window.setTimeout(() => {
          stepIndex += 1;
          render();
          scheduleNext();
        }, delay);
      }

      function togglePlayback() {
        if (isPlaying) {
          stopPlayback();
          return;
        }

        if (stepIndex >= steps.length - 1) {
          stepIndex = 0;
        }

        isPlaying = true;
        render();
        scheduleNext();
      }

      function goToStep(nextIndex) {
        stopPlayback();
        stepIndex = Math.max(0, Math.min(nextIndex, steps.length - 1));
        render();
      }

      function switchAlgorithm(nextAlgorithm) {
        if (nextAlgorithm === algorithm) return;

        stopPlayback();
        algorithm = nextAlgorithm;

        tabs.forEach((tab) => {
          tab.classList.toggle(
            "active",
            tab.dataset.algorithm === algorithm
          );
        });

        buildSteps();
      }

      playBtn.addEventListener("click", togglePlayback);

      prevBtn.addEventListener("click", () => {
        goToStep(stepIndex - 1);
      });

      nextBtn.addEventListener("click", () => {
        goToStep(stepIndex + 1);
      });

      resetBtn.addEventListener("click", () => {
        goToStep(0);
      });

      speedSelect.addEventListener("change", () => {
        speed = Number(speedSelect.value) || 1;

        if (isPlaying) {
          if (timerId !== null) {
            window.clearTimeout(timerId);
          }
          scheduleNext();
        }
      });

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          switchAlgorithm(tab.dataset.algorithm);
        });
      });

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        const isFormControl =
          target instanceof HTMLInputElement ||
          target instanceof HTMLSelectElement ||
          target instanceof HTMLTextAreaElement;

        if (isFormControl) return;

        if (event.code === "Space") {
          event.preventDefault();
          togglePlayback();
        } else if (event.code === "ArrowLeft") {
          goToStep(stepIndex - 1);
        } else if (event.code === "ArrowRight") {
          goToStep(stepIndex + 1);
        } else if (event.key.toLowerCase() === "r") {
          goToStep(0);
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && isPlaying) {
          stopPlayback();
        }
      });

      createGrid();
      buildSteps();
    })();
  </script>
